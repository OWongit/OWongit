<svg xmlns="http://www.w3.org/2000/svg" width="600" height="375" viewBox="0 0 600 375" role="img" aria-labelledby="title">
  <title id="title">See all projects on owongit.github.io</title>
  <style>
    text { font-family: 'IBM Plex Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) { .arrow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001d6c" stop-opacity="0.72"/>
      <stop offset="0.34" stop-color="#001141" stop-opacity="0.45"/>
      <stop offset="0.74" stop-color="#001141" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="purple" cx="528" cy="0" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6929c4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6929c4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#32353b"/>
    </pattern>
  </defs>

  <rect width="600" height="375" fill="#1d1f23"/>
  <rect width="600" height="375" fill="url(#wash)"/>
  <rect width="600" height="375" fill="url(#purple)"/>
  <rect width="600" height="375" fill="url(#dots)" opacity="0.7"/>

  <!-- 3x3 gallery glyph -->
  <g fill="#006fff" fill-opacity="0.18" stroke="#3d8bff" stroke-width="2">
    <rect x="261" y="78" width="20" height="20" rx="3"/>
    <rect x="290" y="78" width="20" height="20" rx="3"/>
    <rect x="319" y="78" width="20" height="20" rx="3"/>
    <rect x="261" y="107" width="20" height="20" rx="3"/>
    <rect x="290" y="107" width="20" height="20" rx="3"/>
    <rect x="319" y="107" width="20" height="20" rx="3"/>
    <rect x="261" y="136" width="20" height="20" rx="3"/>
    <rect x="290" y="136" width="20" height="20" rx="3"/>
    <rect x="319" y="136" width="20" height="20" rx="3" fill="#006fff" fill-opacity="0.8"/>
  </g>

  <text x="300" y="216" fill="#ffffff" font-size="46" font-weight="600" letter-spacing="-0.6" text-anchor="middle">See all projects</text>
  <text x="300" y="254" fill="#a2a7ae" font-size="20" text-anchor="middle">Full galleries, write-ups &amp; resume</text>

  <rect x="150" y="280" width="300" height="50" rx="4" fill="#006fff"/>
  <text x="283" y="312" fill="#ffffff" font-size="21" font-weight="500" text-anchor="middle">owongit.github.io</text>
  <path class="arrow" d="M392 305 H412 M404 297 L412 305 L404 313" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="0.5" y="0.5" width="599" height="374" fill="none" stroke="#32353b"/>
</svg>
